x-logging: &logging_rotated
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

networks:
  pedbox-network:

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16
    container_name: pedbox-postgres
    <<: [ *logging_rotated ]
    restart: unless-stopped
    networks:
      - pedbox-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedbox-backend
    <<: [ *logging_rotated ]
    restart: unless-stopped
    networks:
      - pedbox-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy

  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedbox-prisma-studio
    <<: [ *logging_rotated ]
    restart: unless-stopped
    networks:
      - pedbox-network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm prisma studio --port 51212 --browser none

  nginx:
    image: nginx:1.27-alpine
    container_name: pedbox-proxy
    <<: [ *logging_rotated ]
    restart: unless-stopped
    networks:
      - pedbox-network
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
      image: cloudflare/cloudflared:2025.10.1
      container_name: pedbox-tunnel
      <<: [ *logging_rotated ]
      restart: unless-stopped
      networks:
        - pedbox-network
      depends_on:
        - nginx
      command: tunnel --no-autoupdate --url http://nginx:80